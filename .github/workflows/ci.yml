name: Validate portable skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check public source and blank template
        run: python scripts/public_check.py
      - name: Install pinned analytics dependencies
        run: python -m pip install -r scripts/requirements-analysis.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Fetch official public API contracts (no account credentials)
        run: python scripts/refresh_catalog.py
      - name: API client tests
        run: node --test scripts/qualtrics.test.mjs
      - name: Python tests with synthetic data and inert keys
        run: python -m unittest discover -s scripts -p "test_*.py"
